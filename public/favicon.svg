<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="100%" stop-color="#0f0d17" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="128" fill="#0d0d0d" />
  <circle cx="256" cy="276" r="190" fill="url(#darkGrad)" stroke="url(#purpleGrad)" stroke-width="14" filter="url(#glow)" />
  
  <!-- Stopwatch top stem & button -->
  <rect x="236" y="44" width="40" height="42" rx="8" fill="url(#purpleGrad)" />
  <rect x="216" y="32" width="80" height="18" rx="9" fill="#c084fc" />
  <rect x="360" y="90" width="22" height="34" rx="6" transform="rotate(35 371 107)" fill="url(#purpleGrad)" />

  <!-- Inner dial ticks -->
  <circle cx="256" cy="276" r="150" fill="none" stroke="#2a2440" stroke-width="4" stroke-dasharray="6, 14" />
  <circle cx="256" cy="276" r="12" fill="#c084fc" />

  <!-- Stopwatch Hands -->
  <line x1="256" y1="276" x2="256" y2="170" stroke="#f472b6" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="276" x2="330" y2="230" stroke="#a855f7" stroke-width="6" stroke-linecap="round" />

  <!-- Mini Lightning / Focus icon at bottom -->
  <path d="M250 330 L264 330 L254 350 L270 350 L246 380 L252 356 L240 356 Z" fill="#ec4899" />
</svg>
