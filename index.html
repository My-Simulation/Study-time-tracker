<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JeetPrep" />
    <meta name="description" content="JeetPrep - Track your daily study sessions with live lock screen controls, stopwatch, and Kit AI study mentor" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>JeetPrep · Study Time Tracker</title>
  </head>
  <body style="background-color: #0d0d0d; color: white; margin: 0; min-height: 100vh;">
    <div id="root">
      <div class="stt-initial-spinner" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#0d0d0d;color:#fff;font-family:system-ui,-apple-system,sans-serif;">
        <div style="font-size:36px;margin-bottom:12px;filter:drop-shadow(0 4px 12px rgba(168,85,247,0.3));">⏱️</div>
        <div style="font-size:18px;font-weight:700;letter-spacing:-0.01em;color:#fff;">JeetPrep <span style="font-size:13px;font-weight:500;color:#a855f7;">· Study Tracker</span></div>
        <div style="margin-top:16px;width:22px;height:22px;border:2.5px solid rgba(168,85,247,0.25);border-top-color:#a855f7;border-radius:50%;animation:sttSpin 0.7s linear infinite;"></div>
        <button id="stt-rescue-btn" onclick="sttForceCleanReload()" style="display:none;margin-top:24px;padding:9px 18px;background:linear-gradient(135deg,#7c3aed,#9333ea);color:#fff;border:none;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(124,58,237,0.4);font-family:inherit;">↻ Tap to Refresh App</button>
      </div>
      <style>@keyframes sttSpin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      // 1. Auto-recover if Vite chunk fails to load or stale hash requested
      window.addEventListener('vite:preloadError', (event) => {
        event.preventDefault();
        window.location.reload();
      });

      // 2. Watchdog: if root still has the loading spinner after 2.8s, reveal manual rescue button
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.querySelector && root.querySelector('.stt-initial-spinner')) {
          var btn = document.getElementById('stt-rescue-btn');
          if (btn) btn.style.display = 'inline-block';
        }
      }, 2800);

      function sttForceCleanReload() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
          });
        }
        window.location.href = window.location.pathname + '?v=' + Date.now();
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
